name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # O instalador aceita Python 3.10 a 3.13 no Windows: as versões fixas valem nas duas pontas.
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Conferir que todas as bibliotecas fixas instalam neste Python
        run: python -m pip install --dry-run "--only-binary=:all:" -r requirements.txt
      - name: Instalar dependências de teste (as versões fixas, menos o faster-whisper)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -v '^faster-whisper' requirements.txt > requisitos-teste.txt
          python -m pip install -r requisitos-teste.txt
      - name: Rodar testes
        run: python -m unittest discover -s tests -v
